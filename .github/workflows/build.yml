name: Build WonderSwan AI/MTL Tester

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wonderswan-wasm-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v14
        with:
          version: '4.0.19'
      - name: Verify toolchain
        run: |
          emcc --version
          emar --version
      - name: Bridge ABI test (mock core, native gcc)
        run: |
          gcc -Wall -O1 -fsanitize=address,undefined scripts/mock_core_test.c src/bridge.c -o mock_core_test
          ./mock_core_test
      - name: Build linked Mednafen WASM
        run: bash scripts/build.sh
      - name: Verify output and JS
        run: |
          node --check site/app.js
          node --check site/patches.js
          node --check site/archive.js
          node tests/patches_test.js
          SEVENZIP_DIR=.build/7z-wasm/package node tests/archive_test.js
          python3 scripts/verify_build.py .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonderswan-wasm-site
          path: site/
          retention-days: 7
          if-no-files-found: error
      - name: Publish built site to the wasm-build branch (served by GitHub Pages)
        if: github.ref == 'refs/heads/main'
        run: |
          cd site
          rm -rf .git
          touch .nojekyll   # GitHub Pages: serve the files as they are, no Jekyll
          git init -q -b wasm-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "WASM build of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:wasm-build
