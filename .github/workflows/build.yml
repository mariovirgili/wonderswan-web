name: Build WonderSwan AI/MTL Tester

# Every change is built and tested: pushes to any branch and pull requests.
# Only a push to main that passes every check is published (GitHub Pages + the wasm-build branch).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a build in progress on the same ref; a Pages deployment already started is
# never cut short (the deploy job has its own concurrency group).
concurrency:
  group: wonderswan-wasm-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # only used to push the wasm-build branch, and only from main
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: '4.0.19'
      - name: Verify toolchain
        run: |
          emcc --version
          emar --version
      - name: Bridge ABI test (mock core, native gcc)
        run: |
          gcc -Wall -O1 -fsanitize=address,undefined scripts/mock_core_test.c src/bridge.c -o mock_core_test
          ./mock_core_test
      - name: Build the Mednafen, ares and Mesen WASM cores (+ corresponding source)
        env:
          JOBS: '4'
        run: bash scripts/build.sh
      - name: Unit tests and output checks
        run: |
          node --check site/app.js
          node --check site/patches.js
          node --check site/archive.js
          node --check site/worker.js
          node --check tests/core_test.js
          node tests/patches_test.js
          SEVENZIP_DIR=.build/7z-wasm/package node tests/archive_test.js
          python3 scripts/verify_build.py .
      - name: ares and Mesen core tests (Node)
        run: |
          node tests/core_test.js site ares
          node tests/core_test.js site mesen
      - name: End-to-end test in headless Chromium
        run: |
          npm install --no-save --no-package-lock --silent playwright@1.63.0
          npx playwright install --with-deps chromium > /dev/null
          node tests/e2e_test.js site
          rm -rf node_modules
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wonderswan-wasm-site
          path: site/
          retention-days: 7
          if-no-files-found: error
      - name: Package the site for GitHub Pages
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      # A copy of the built site on a branch, for fetching builds with plain git. GitHub Pages does
      # NOT use it: pushes made with GITHUB_TOKEN never trigger a Pages build. Pages is deployed by
      # the deploy job below.
      - name: Publish built site to the wasm-build branch
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd site
          rm -rf .git
          git init -q -b wasm-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "WASM build of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:wasm-build

  deploy:
    # Runs only after every check in "build" passed. Requires Settings -> Pages -> Source: "GitHub Actions".
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
